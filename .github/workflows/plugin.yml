name: plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The `plugin` job of docs/design/companion-app.md §3.4: every format on each desktop
  # OS, the headless wrapper tests and the offscreen editor render. pluginval and the
  # parity legs (companion §3.4, determinism profile §6.2) are still to come.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Release]
        include:
          # Debug legs: the zero-frame rule (companion §4.3) and the engine's block-size
          # contract are enforced by asserts that Release compiles out, and JUCE's
          # jasserts and leak detector run only here.
          - os: ubuntu-latest
            config: Debug
          - os: windows-latest
            config: Debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # JUCE's list (docs/Linux Dependencies.md at 9.0.3), minus curl and WebKit, which
      # JUCE_USE_CURL=0 and JUCE_WEB_BROWSER=0 leave out; xvfb hosts the GUI tests.
      - name: Install JUCE's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev xvfb

      # The pinned JUCE archive; FetchContent re-verifies its SHA-256 and skips the download.
      - name: Cache the JUCE archive
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-subbuild/juce-populate-prefix/src/9.0.3.tar.gz
          key: juce-9.0.3-a81e5508b8a0efa4

      # BRAINSCAPE_WERROR holds dsp/ (built here with the plugin's PIC and visibility
      # flags) and Brainscape's own plugin sources to zero warnings.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DBRAINSCAPE_BUILD_PLUGIN=ON -DBRAINSCAPE_BUILD_TESTS=ON -DBRAINSCAPE_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --timeout 900

      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --timeout 900

      - name: Upload editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshots-${{ matrix.os }}-${{ matrix.config }}
          path: build/plugin/screenshots
          if-no-files-found: ignore
