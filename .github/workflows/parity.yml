name: parity

# Golden-hash parity legs (docs/design/determinism-profile.md §6.1-§6.4, §6.8).
# GATING since internal sound revision 1 (profile §8.4 step 10): every leg renders the
# golden corpus in --mode check against dsp/tests/golden/golden.json, on the pedal's
# 48-frame grid and under the perturbations of §6.4, and fails on any hash, per-second
# hash or counter that differs, on a render that crashes and on missing coverage.
# parity-summary compares the legs' reports with each other and fails on any canonical
# mismatch or a negative control that matches. A golden file is minted from one build
# (brainscape_golden --mode mint) and committed with the kSoundRevision bump; the pull
# request then needs every x86 leg and the emulated M7 to agree with it in one run
# (§6.1), and sound-rev.yml holds the bump rule (§5.12).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The hashes gate (profile §8.4 step 10): the legs run --mode check and parity-summary
  # --gate. Set to "false" only to triage a toolchain change; the legs then report.
  PARITY_HASHES_GATING: "true"
  # The static audits (profile §6.3) gate: the build profile, header hygiene and DetMath
  # have landed, so a libm import, a fused instruction or a missing or forbidden FP
  # flag fails its leg. Set to "false" only to triage a toolchain change.
  PARITY_AUDITS_GATING: "true"

jobs:
  # Host matrix (profile §6.2): one Release build per toolchain renders the corpus on
  # the pedal's 48-frame grid, then again at 512-frame blocks and from a hostile caller
  # FP environment, each checked against the golden file. CXXFLAGS seeds
  # CMAKE_CXX_FLAGS ahead of the platform defaults, so /arch:AVX2 keeps /EHsc.
  parity-host:
    name: parity-host (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x64-gcc
            os: ubuntu-24.04
            cxx: g++
            symbols: gcc
          - leg: linux-x64-clang
            os: ubuntu-24.04
            cxx: clang++
            symbols: clang
          - leg: linux-arm64-gcc
            os: ubuntu-24.04-arm
            cxx: g++
            symbols: gcc
          - leg: windows-x64-msvc
            os: windows-2022
            symbols: msvc
          - leg: windows-x64-msvc-avx2
            os: windows-2022
            cxxflags: /arch:AVX2
            symbols: msvc
          - leg: macos-arm64-appleclang
            os: macos-14
            symbols: appleclang
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LEG: ${{ matrix.leg }}
      LEG_CXX: ${{ matrix.cxx }}
      LEG_SYMBOLS: ${{ matrix.symbols }}
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ -n "$LEG_CXX" ]; then export CXX="$LEG_CXX"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBRAINSCAPE_BUILD_TESTS=ON
      - name: Build the golden harness
        id: build
        run: cmake --build build --config Release --target brainscape_golden
      - name: Select the harness mode
        run: |
          echo "BIN=$(find build -type f \( -name brainscape_golden -o -name brainscape_golden.exe \) | head -n 1)" >> "$GITHUB_ENV"
          if [ "$PARITY_HASHES_GATING" = true ]; then echo MODE=check; else echo MODE=report; fi >> "$GITHUB_ENV"
          mkdir -p parity-report
      - name: Render the corpus (48-frame grid)
        run: '"$BIN" --mode "$MODE" --tag "$LEG" --report "parity-report/$LEG.json"'
      # Each perturbation below runs even when a render before it failed, for triage.
      # Profile §6.4's block perturbations: with §5.7's block-split fix landed, each must
      # reproduce the golden hashes (contract #1).
      - name: Render at 512-frame blocks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_HASHES_GATING != 'true' }}
        run: '"$BIN" --mode "$MODE" --no-ablate --block 512 --tag "$LEG" --report "parity-report/$LEG-b512.json"'
      # Profile §6.4: the whole corpus rendered from a thread whose control word is FTZ|DAZ
      # (Arm FZ|DN) with round toward zero must reproduce the golden hashes; the engine's
      # guard owns the word at every entry point, Init included.
      - name: Render under a hostile caller FP environment
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_HASHES_GATING != 'true' }}
        run: '"$BIN" --mode "$MODE" --no-ablate --fp-env hostile --tag "$LEG" --report "parity-report/$LEG-hostile.json"'
      - name: Render at the other block sizes of profile §6.4
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'linux-x64-gcc' }}
        continue-on-error: ${{ env.PARITY_HASHES_GATING != 'true' }}
        run: |
          rc=0
          for b in 1 7 32 37 64 127 48,1,127,32 300,512,5,64; do
            "$BIN" --mode "$MODE" --no-ablate --pattern "$b" --tag "$LEG" \
              --report "parity-report/$LEG-b${b//,/-}.json" || { echo "blocks $b: exit $?"; rc=1; }
          done
          exit $rc
      # Profile §5.11 and §5.8: the same events applied by a wrapper that splits blocks at
      # their frames, and an engine Init'd per render instead of restarted, must render
      # the golden bits.
      - name: Render with wrapper-side event splitting and fresh engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'linux-x64-gcc' }}
        continue-on-error: ${{ env.PARITY_HASHES_GATING != 'true' }}
        run: |
          rc=0
          for b in 48 512 300,512,5,64; do
            "$BIN" --mode "$MODE" --no-ablate --delivery split --pattern "$b" --tag "$LEG" \
              --report "parity-report/$LEG-split-b${b//,/-}.json" || { echo "split blocks $b: exit $?"; rc=1; }
          done
          "$BIN" --mode "$MODE" --no-ablate --fresh-engine --tag "$LEG" \
            --report "parity-report/$LEG-fresh.json" || { echo "fresh engine: exit $?"; rc=1; }
          exit $rc
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ matrix.leg }}
          path: parity-report/
          if-no-files-found: warn
      # Static audits that need this leg's toolchain (profile §6.3).
      - name: Audit imported symbols (no libm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Windows' }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: python3 tools/ci/audit_symbols.py --toolchain "$LEG_SYMBOLS" build/dsp/libbrainscape_dsp.a
      - name: Audit imported symbols (MSVC, no libm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -like '*\Hostx64\x64\*' } | Select-Object -First 1
          $objects = (Get-ChildItem build/dsp/brainscape_dsp.dir/Release -Filter *.obj).FullName
          python tools/ci/audit_symbols.py --toolchain msvc --dumpbin $dumpbin.FullName @objects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Only an AVX2 build can contain x86 fused instructions; the SSE2 leg cannot fail.
      - name: Audit fused instructions (MSVC /arch:AVX2)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.cxxflags == '/arch:AVX2' }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bin = (Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter cl.exe |
            Where-Object { $_.FullName -like '*\Hostx64\x64\*' } | Select-Object -First 1).DirectoryName
          & "$bin\cl.exe" /nologo /O2 /arch:AVX2 /fp:contract /c tools/ci/fused_selftest.cpp /Fobuild/fused_selftest.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $objects = (Get-ChildItem build/dsp/brainscape_dsp.dir/Release -Filter *.obj).FullName
          python tools/ci/audit_fused.py --dumpbin "$bin\dumpbin.exe" --arch x86 --self-test build/fused_selftest.obj @objects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit fused instructions (AArch64)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.leg, 'arm64') }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: |
          ${LEG_CXX:-c++} -O2 -ffp-contract=fast -c tools/ci/fused_selftest.cpp -o build/fused_selftest.o
          python3 tools/ci/audit_fused.py --arch aarch64 --self-test build/fused_selftest.o build/dsp/libbrainscape_dsp.a

  # The emulated Cortex-M7 (profile §6.2, §6.8): the pinned arm-none-eabi toolchain and
  # firmware flags build the same dsp/ archive the firmware links, and the pinned
  # qemu-arm user mode runs the harness through the syscall shim.
  parity-m7:
    name: parity-m7 (qemu-arm cortex-m7)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned arm-none-eabi toolchain
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-10.3-2021.10-x86_64-linux
      - name: Install the pinned arm-none-eabi toolchain (10.3-2021.10, checksum-verified)
        run: bash tools/ci/install_arm_toolchain.sh "$HOME/arm-gnu-toolchain"
      - name: Cache the pinned qemu-arm
        uses: actions/cache@v4
        with:
          path: ~/qemu-arm
          key: qemu-arm-10.2.3-ubuntu-24.04
      - name: Install the pinned qemu-arm (10.2.3, version-checked)
        run: bash tools/ci/install_qemu_arm.sh "$HOME/qemu-arm"
      # dsp/CMakeLists.txt archives with ar's D modifier and ranlib -D, which zero member
      # timestamps, owners and modes, so identical objects give one archive SHA-256
      # (profile §6.2) here and in the firmware link.
      - name: Configure (firmware flags)
        run: >
          cmake -B build-m7 -DCMAKE_TOOLCHAIN_FILE=tools/cmake/arm-none-eabi-toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release -DBRAINSCAPE_BUILD_TESTS=OFF -DBRAINSCAPE_BUILD_M7_ORACLE=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build the golden harness ELF
        id: build
        run: cmake --build build-m7 --target brainscape_golden
      - name: Select the harness mode
        run: |
          if [ "$PARITY_HASHES_GATING" = true ]; then echo MODE=check; else echo MODE=report; fi >> "$GITHUB_ENV"
      - name: Render the corpus under qemu-arm -cpu cortex-m7
        run: |
          mkdir -p parity-report
          ARCHIVE_SHA256=$(sha256sum build-m7/dsp/libbrainscape_dsp.a | cut -d' ' -f1)
          EMULATOR="$(qemu-arm --version | head -n 1) commit $(cat "$HOME/qemu-arm/COMMIT")"
          echo "libbrainscape_dsp.a $ARCHIVE_SHA256; $EMULATOR"
          qemu-arm -cpu cortex-m7 build-m7/dsp/tests/golden/brainscape_golden.elf \
            --mode "$MODE" --no-ablate --tag m7-qemu --report parity-report/m7-qemu.json \
            --note "archiveSha256=$ARCHIVE_SHA256" --note "emulator=$EMULATOR"
      # Profile §6.4 on the M7: FPSCR = FZ|DN with round toward zero in the calling code,
      # and the pedal's block grid replaced by 512-frame blocks and an odd pattern.
      - name: Render under a hostile caller FPSCR
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_HASHES_GATING != 'true' }}
        run: |
          qemu-arm -cpu cortex-m7 build-m7/dsp/tests/golden/brainscape_golden.elf --mode "$MODE" \
            --no-ablate --fp-env hostile --tag m7-qemu --report parity-report/m7-qemu-hostile.json
      - name: Render at other block sizes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_HASHES_GATING != 'true' }}
        run: |
          rc=0
          for b in 512 48,1,127,32; do
            qemu-arm -cpu cortex-m7 build-m7/dsp/tests/golden/brainscape_golden.elf --mode "$MODE" \
              --no-ablate --pattern "$b" --tag m7-qemu --report "parity-report/m7-qemu-b${b//,/-}.json" ||
              { echo "blocks $b: exit $?"; rc=1; }
          done
          exit $rc
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-m7-qemu
          path: parity-report/
          if-no-files-found: warn
      - name: Audit fused instructions (Armv7-M)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: |
          arm-none-eabi-g++ -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard -O3 -ffp-contract=fast \
            -c tools/ci/fused_selftest.cpp -o build-m7/fused_selftest.o
          python3 tools/ci/audit_fused.py --objdump arm-none-eabi-objdump --arch armv7 \
            --self-test build-m7/fused_selftest.o build-m7/dsp/libbrainscape_dsp.a
      - name: Audit imported symbols (arm-none-eabi, no libm)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: python3 tools/ci/audit_symbols.py --toolchain arm --nm arm-none-eabi-nm build-m7/dsp/libbrainscape_dsp.a
      - name: Audit compile flags (firmware build)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: python3 tools/ci/audit_flags.py build-m7/compile_commands.json

  # Host static audits (profile §6.3) on GCC builds. The fused-instruction audit needs
  # a target with FMA: baseline x86-64 has none, so it audits an x86-64-v3 archive
  # (the profile's AVX2 class) built with the same flags otherwise.
  parity-audits:
    name: parity-audits (host GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBRAINSCAPE_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Configure the x86-64-v3 build
        run: cmake -B build-v3 -DCMAKE_BUILD_TYPE=Release -DBRAINSCAPE_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS=-march=x86-64-v3
      - name: Build the dsp libraries
        run: |
          cmake --build build --target brainscape_dsp
          cmake --build build-v3 --target brainscape_dsp
      - name: Audit fused instructions (x86-64-v3)
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: |
          g++ -O2 -march=x86-64-v3 -ffp-contract=fast -c tools/ci/fused_selftest.cpp -o build-v3/fused_selftest.o
          python3 tools/ci/audit_fused.py --arch x86 --self-test build-v3/fused_selftest.o build-v3/dsp/libbrainscape_dsp.a
      - name: Audit compile flags
        continue-on-error: ${{ env.PARITY_AUDITS_GATING != 'true' }}
        run: python3 tools/ci/audit_flags.py build/compile_commands.json

  # Negative control (profile §6.4): a contracting build must NOT reproduce the
  # reference hashes; if it does, the corpus cannot see contraction. The profile forces
  # -ffp-contract=off and its configure check rejects contraction, so this build goes
  # through the test-only escape: BRAINSCAPE_FP_NEGATIVE_CONTROL turns contraction on,
  # warns, and makes the harness refuse check and mint (report only).
  parity-negative-control:
    name: parity-negative-control (contraction on)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with contraction on and hardware FMA
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBRAINSCAPE_BUILD_TESTS=ON
          -DBRAINSCAPE_FP_NEGATIVE_CONTROL=ON -DCMAKE_CXX_FLAGS=-march=x86-64-v3
      - name: Build the golden harness
        run: cmake --build build --target brainscape_golden
      # Report mode compares with the golden file without failing; the contracting build
      # must miss it, or the corpus cannot see contraction (parity-summary gates that too).
      - name: Render the corpus (expected to differ from the golden file)
        run: |
          mkdir -p parity-report
          build/dsp/tests/golden/brainscape_golden --no-ablate --tag negctl-gcc-contract \
            --report parity-report/negctl-gcc-contract.json | tee negctl.txt
          if ! grep -q "^# golden: MISMATCH" negctl.txt; then
            echo "::error::the contracting build reproduced the golden hashes"
            exit 1
          fi
      # Exit 3 with the negative-control message, not a check failure (exit 2): the build
      # must refuse to compare at all.
      - name: The harness refuses check and mint in this build
        run: |
          for mode in check mint; do
            rc=0
            build/dsp/tests/golden/brainscape_golden --mode "$mode" --only plucks_12s/default \
              --no-ablate > /dev/null 2> "refusal-$mode.txt" || rc=$?
            if [ "$rc" -ne 3 ] ||
               ! grep -q "$mode refused: a negative-control build only reports" "refusal-$mode.txt"; then
              echo "::error::the negative-control build did not refuse --mode $mode (exit $rc)"
              cat "refusal-$mode.txt"
              exit 1
            fi
          done
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-negctl-gcc-contract
          path: parity-report/
          if-no-files-found: warn

  parity-summary:
    name: parity-summary
    needs: [parity-host, parity-m7, parity-negative-control]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-report-*
          path: parity-report
          merge-multiple: true
      - name: Compare the legs
        run: |
          args=(--reference linux-x64-gcc --summary "$GITHUB_STEP_SUMMARY")
          if [ "$PARITY_HASHES_GATING" = true ]; then args+=(--gate); fi
          python3 tools/ci/parity_compare.py parity-report "${args[@]}"
