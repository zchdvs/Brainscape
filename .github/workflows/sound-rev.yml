name: sound-rev

# companion-app.md §3.4's sound-rev-gate, the two triggers of determinism-profile.md §5.12.
# Hard trigger: a pull request that changes a golden hash fails unless it bumps
# kSoundRevision, whatever its labels. Path trigger: one that touches dsp/src, dsp/include,
# dsp/CMakeLists.txt, the root CMakeLists.txt, cmake/BrainscapeFpProfile.cmake,
# cmake/fp-forbidden-flags.txt or the arm toolchain file must bump it or carry the
# "sound-neutral" label, which a code owner justifies in review.
# The package rule (mode-compiler.md §8.3): a changed soundHash or controlHash of a committed
# package (a golden preset's in golden.json, a corpus or factory package's in
# dsp/tests/golden/presets/MANIFEST or firmware/factory/MANIFEST, which bspc-roundtrip requires
# and checks) needs the "package-change" label and a "Package-change: <cause>" line in the
# description, which a code owner approves; a golden preset's changed render whose package
# changed is the package's, not the engine's, unless the pull request also touches the path
# trigger's paths without a bump. Editing the description re-runs the gate.
# Sound revisions are checked per commit: each revision is one commit that raises
# kSoundRevision by exactly one, and its golden file is minted at that revision, by that commit
# or a later one before the next bump; a pull request may carry several consecutive revisions.
# The gate walks every commit between the merge commit's first parent and the merge commit and
# fails a commit that lowers the revision or raises it by more than one, a revision two commits
# introduce, one the base already has, a gap in the numbers and a revision no commit at that
# revision minted. It checks a lower revision's golden file by its key, not by rendering it:
# sound-rev-render.yml renders each one at the last commit at its revision, and parity and host
# render the head's. Until branch protection requires sound-rev-render, each revision commit is
# also pushed and passes parity and host as the pull request's head before the next one. The
# walk needs the whole history (fetch-depth: 0); on a shallow clone or a missing object the
# gate fails rather than pass. The rule holds on main only for pull requests merged with a merge
# commit: a squash merge of one that carries r2 and r3 lands one commit that raises the revision
# by two, which no check reads (docs/STATUS.md, Known gaps).
# Its own workflow, so adding or removing a label re-runs this job and not the parity legs or
# the render.
# The gate runs the pull request's own copy of this file and of the script, so it holds
# only while code owners review changes to .github/workflows/ and tools/ci/ and branch
# protection requires this check (docs/STATUS.md, Known gaps).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  sound-rev-gate:
    name: sound-rev-gate
    runs-on: ubuntu-24.04
    steps:
      # The pull request's merge commit, its first parent (the base it merges into) and the whole
      # history, which the per-commit walk reads.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the gate on synthetic pull requests
        run: python3 tools/ci/test_sound_rev_gate.py
      # The description goes through a file: it is untrusted text, never part of a command.
      - name: Check the sound revision against the pull request
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.txt"
          python3 tools/ci/sound_rev_gate.py --base HEAD^1 --head HEAD --labels "$LABELS" \
            --body-file "$RUNNER_TEMP/pr-body.txt" --summary "$GITHUB_STEP_SUMMARY"
